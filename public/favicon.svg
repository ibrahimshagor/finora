<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="finoraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#finoraGrad)" filter="url(#glow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="8" />

  <!-- Modern Geometric 'F' & Growth Arrow Glyph -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Vertical Stem of F -->
    <path d="M168 128 V384" stroke-width="48" />
    
    <!-- Top Horizontal Bar of F -->
    <path d="M168 152 H344" stroke-width="48" />
    
    <!-- Middle Horizontal Bar of F -->
    <path d="M168 256 H296" stroke-width="44" stroke="url(#accentGrad)" />
  </g>

  <!-- Growth Sparkle / Upward Trend Dot -->
  <circle cx="344" cy="152" r="22" fill="#FDE047" />
  
  <!-- Upward Trend Accent Line -->
  <path d="M296 256 L384 168" stroke="#34D399" stroke-width="24" stroke-linecap="round" stroke-dasharray="1 1" />
</svg>
